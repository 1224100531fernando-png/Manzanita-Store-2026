
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar reparación | Manzanita Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

<header class="bg-slate-950 text-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <div>
            <h1 class="text-xl font-bold">
                Manzanita <span class="text-blue-400">Store</span>
            </h1>
            <p class="text-xs text-slate-400">Sistema de gestión</p>
        </div>
        <a href="../autenticacion/login.html"
           class="rounded-lg border border-slate-700 px-4 py-2 text-sm hover:bg-slate-800">
            Salir
        </a>
    </div>
</header>

<main class="mx-auto max-w-4xl px-6 py-8">

    <div class="mb-7">
        <a href="reparaciones.html"
           class="text-sm font-medium text-blue-600 hover:underline">
            ← Volver a reparaciones
        </a>

        <h2 class="mt-4 text-3xl font-bold text-slate-900">
            Registrar reparación
        </h2>
        <p class="mt-2 text-sm text-slate-500">
            Captura los datos del dispositivo que ingresa a servicio técnico.
        </p>
    </div>

    <form id="formulario" class="rounded-xl bg-white p-6 shadow-sm sm:p-8">

        <h3 class="mb-5 border-b pb-3 text-lg font-semibold">
            Información del cliente
        </h3>

        <div class="mb-7 grid gap-5 sm:grid-cols-2">
            <div>
                <label for="cliente" class="mb-2 block text-sm font-medium">
                    Nombre del cliente *
                </label>
                <input id="cliente" name="cliente" type="text" required maxlength="100"
                       placeholder="Ej. Juan Pérez"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500">
            </div>

            <div>
                <label for="telefono" class="mb-2 block text-sm font-medium">
                    Teléfono *
                </label>
                <input id="telefono" name="telefono" type="tel" required
                       pattern="[0-9]{10}" maxlength="10"
                       title="Escribe 10 dígitos"
                       placeholder="Ej. 4151234567"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-blue-500">
            </div>
        </div>

        <h3 class="mb-5 border-b pb-3 text-lg font-semibold">
            Información del dispositivo
        </h3>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="dispositivo" class="mb-2 block text-sm font-medium">
                    Tipo de dispositivo *
                </label>
                <select id="dispositivo" name="dispositivo" required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3">
                    <option value="">Selecciona un dispositivo</option>
                    <option>iPhone</option>
                    <option>iPad</option>
                    <option>MacBook</option>
                    <option>iMac</option>
                    <option>Apple Watch</option>
                    <option>Otro</option>
                </select>
            </div>

            <div>
                <label for="modelo" class="mb-2 block text-sm font-medium">
                    Modelo *
                </label>
                <input id="modelo" name="modelo" type="text" required maxlength="100"
                       placeholder="Ej. iPhone 13 Pro"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label for="serie" class="mb-2 block text-sm font-medium">
                    Número de serie
                </label>
                <input id="serie" name="serie" type="text" maxlength="100"
                       placeholder="Número de serie del equipo"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label for="fecha" class="mb-2 block text-sm font-medium">
                    Fecha de recepción *
                </label>
                <input id="fecha" name="fecha" type="date" required
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>
        </div>

        <div class="mt-5">
            <label for="falla" class="mb-2 block text-sm font-medium">
                Descripción de la falla *
            </label>
            <textarea id="falla" name="falla" rows="4" required maxlength="1000"
                      placeholder="Describe el problema que presenta el dispositivo..."
                      class="w-full rounded-lg border border-slate-300 px-4 py-3"></textarea>
        </div>

        <h3 class="mb-5 mt-8 border-b pb-3 text-lg font-semibold">
            Información del servicio
        </h3>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="tecnico" class="mb-2 block text-sm font-medium">
                    Técnico responsable *
                </label>
                <input id="tecnico" name="tecnico" type="text" required maxlength="100"
                       placeholder="Nombre del técnico"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label for="costo" class="mb-2 block text-sm font-medium">
                    Costo estimado (MXN) *
                </label>
                <input id="costo" name="costo" type="number"
                       min="0" step="0.01" required
                       placeholder="0.00"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label for="estado" class="mb-2 block text-sm font-medium">
                    Estado inicial *
                </label>
                <select id="estado" name="estado" required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3">
                    <option value="Pendiente">Pendiente</option>
                    <option value="En proceso">En proceso</option>
                </select>
            </div>
        </div>

        <div id="mensaje" role="status" aria-live="polite"
             class="mt-6 hidden rounded-lg bg-blue-50 p-4 text-sm text-blue-800"></div>

        <div class="mt-8 flex flex-wrap justify-end gap-3 border-t pt-6">
            <a href="reparaciones.html"
               class="rounded-lg border border-slate-300 px-6 py-3 text-sm font-semibold hover:bg-slate-100">
                Cancelar
            </a>

            <button type="submit"
                    class="rounded-lg bg-blue-600 px-6 py-3 text-sm font-semibold text-white hover:bg-blue-700">
                Guardar reparación
            </button>
        </div>

    </form>
</main>

<footer class="py-6 text-center text-xs text-slate-400">
    Manzanita Store · 2026
</footer>

<script>
    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");

    // Fecha local para evitar cambios por zona horaria.
    const hoy = new Date();
    const fechaLocal = new Date(
        hoy.getTime() - hoy.getTimezoneOffset() * 60000
    ).toISOString().slice(0, 10);

    document.getElementById("fecha").value = fechaLocal;

    formulario.addEventListener("submit", function(evento) {
        evento.preventDefault();

        if (!formulario.reportValidity()) return;

        mensaje.classList.remove("hidden");
        mensaje.textContent =
            "Formulario validado correctamente. " +
            "Falta conectar el servidor y la base de datos para guardar la reparación.";
    });
</script>

</body>
</html>
