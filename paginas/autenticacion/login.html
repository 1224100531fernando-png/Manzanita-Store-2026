
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Manzanita Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

    <main class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">
                Iniciar sesión
            </h1>

            <p class="text-gray-500 mt-2">
                Ingresa tus datos para acceder al sistema.
            </p>
        </div>

        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensaje in mensajes %}
                <div class="mb-4 p-3 rounded-lg text-sm
                    {% if categoria == 'error' %}
                        bg-red-100 text-red-700
                    {% else %}
                        bg-green-100 text-green-700
                    {% endif %}">
                    {{ mensaje }}
                </div>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">

            <div>
                <label for="usuario"
                    class="block text-sm font-semibold text-gray-700 mb-2">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">
            </div>

            <div>
                <label for="password"
                    class="block text-sm font-semibold text-gray-700 mb-2">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingresa tu contraseña"
                    required
                    autocomplete="current-password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">
            </div>

            <div class="text-right">
                <a href="#"
                    class="text-sm text-blue-600 hover:text-blue-800 hover:underline">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white
                font-semibold py-3 rounded-lg transition duration-200 shadow-sm">
                Iniciar sesión
            </button>

        </form>

        <div class="flex items-center gap-4 my-6">
            <div class="flex-1 border-t border-gray-300"></div>
            <span class="text-gray-400 text-sm">O</span>
            <div class="flex-1 border-t border-gray-300"></div>
        </div>

        <div class="text-center">
            <p class="text-gray-600 text-sm">
                ¿No tienes una cuenta?
            </p>

            <a href="{{ url_for('registro') }}"
                class="inline-block mt-3 text-blue-600 font-semibold
                hover:text-blue-800 hover:underline">
                Crear una cuenta
            </a>
        </div>

    </main>

</body>
</html>
