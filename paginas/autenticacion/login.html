<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manzanita Store | Iniciar sesión</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="min-h-screen bg-gray-100">

    <!-- Encabezado -->

    <header class="bg-gray-900 text-white">

        <div class="mx-auto max-w-6xl px-6 py-5">

            <h1 class="text-2xl font-bold">
                Manzanita Store
            </h1>

            <p class="text-sm text-gray-300">
                Sistema de gestión
            </p>

        </div>

    </header>


    <!-- Contenido principal -->

    <main class="flex min-h-[calc(100vh-140px)] items-center justify-center px-6">

        <section class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">

            <div class="mb-6 text-center">

                <h2 class="text-2xl font-bold text-gray-900">
                    Iniciar sesión
                </h2>

                <p class="mt-2 text-sm text-gray-500">
                    Ingresa tus datos para acceder al sistema.
                </p>

            </div>


            <form action="#" method="post" class="space-y-5">

                <!-- Usuario -->

                <div>

                    <label
                        for="usuario"
                        class="mb-2 block text-sm font-medium text-gray-700"
                    >
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    >

                </div>


                <!-- Contraseña -->

                <div>

                    <label
                        for="password"
                        class="mb-2 block text-sm font-medium text-gray-700"
                    >
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    >

                </div>


                <!-- Botón -->

                <button
                    type="submit"
                    class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
                    Iniciar sesión
                </button>

            </form>


            <!-- Recuperación -->

            <div class="mt-6 text-center">

                <a
                    href="#"
                    class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline"
                >
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

        </section>

    </main>


    <!-- Pie de página -->

    <footer class="border-t border-gray-200 bg-white">

        <div class="mx-auto max-w-6xl px-6 py-4 text-center">

            <p class="text-sm text-gray-500">
                Manzanita Store &copy; 2026
            </p>

        </div>

    </footer>

</body>

</html>
