
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Manzanita Store</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

    <!-- Contenedor principal -->
    <main class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8 my-8">

        <!-- Encabezado -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-gray-800">
                Crear una cuenta
            </h1>

            <p class="text-gray-500 mt-2">
                Registra tus datos para acceder a Manzanita Store.
            </p>

        </div>

        <!-- Mensajes de Flask -->
        {% with mensajes = get_flashed_messages(with_categories=true) %}

            {% for categoria, mensaje in mensajes %}

                <div class="mb-4 p-3 rounded-lg text-sm
                    {% if categoria == 'error' %}
                        bg-red-100 text-red-700
                    {% else %}
                        bg-green-100 text-green-700
                    {% endif %}">

                    {{ mensaje }}

                </div>

            {% endfor %}

        {% endwith %}

        <!-- Formulario de registro -->
        <form action="{{ url_for('registro') }}" method="GET" class="space-y-4">

            <!-- Nombre -->
            <div>

                <label
                    for="nombre"
                    class="block text-sm font-semibold text-gray-700 mb-2">

                    Nombre(s)

                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ingresa tu nombre"
                    required
                    autocomplete="given-name"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">

            </div>

            <!-- Apellidos -->
            <div>

                <label
                    for="apellidos"
                    class="block text-sm font-semibold text-gray-700 mb-2">

                    Apellidos

                </label>

                <input
                    type="text"
                    id="apellidos"
                    name="apellidos"
                    placeholder="Ingresa tus apellidos"
                    required
                    autocomplete="family-name"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">

            </div>

            <!-- Usuario -->
            <div>

                <label
                    for="usuario"
                    class="block text-sm font-semibold text-gray-700 mb-2">

                    Usuario

                </label>

                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Crea un nombre de usuario"
                    required
                    autocomplete="username"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">

            </div>

            <!-- Correo electrónico -->
            <div>

                <label
                    for="correo"
                    class="block text-sm font-semibold text-gray-700 mb-2">

                    Correo electrónico

                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    required
                    autocomplete="email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">

            </div>

            <!-- Contraseña -->
            <div>

                <label
                    for="password"
                    class="block text-sm font-semibold text-gray-700 mb-2">

                    Contraseña

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crea una contraseña"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">

            </div>

            <!-- Confirmar contraseña -->
            <div>

                <label
                    for="confirmar_password"
                    class="block text-sm font-semibold text-gray-700 mb-2">

                    Confirmar contraseña

                </label>

                <input
                    type="password"
                    id="confirmar_password"
                    name="confirmar_password"
                    placeholder="Confirma tu contraseña"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg
                    focus:outline-none focus:ring-2 focus:ring-blue-500
                    focus:border-blue-500 transition">

            </div>

            <!-- Botón de registro -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white
                font-semibold py-3 rounded-lg transition duration-200
                shadow-sm">

                Crear cuenta

            </button>

        </form>

        <!-- Separador -->
        <div class="flex items-center gap-4 my-6">

            <div class="flex-1 border-t border-gray-300"></div>

            <span class="text-gray-400 text-sm">
                O
            </span>

            <div class="flex-1 border-t border-gray-300"></div>

        </div>

        <!-- Regresar al login -->
        <div class="text-center">

            <p class="text-gray-600 text-sm">
                ¿Ya tienes una cuenta?
            </p>

            <a
                href="{{ url_for('login') }}"
                class="inline-block mt-3 text-blue-600 font-semibold
                hover:text-blue-800 hover:underline">

                Iniciar sesión

            </a>

        </div>

    </main>

</body>

</html>
