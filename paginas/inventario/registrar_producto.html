
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producto | Manzanita Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

<header class="bg-slate-950 text-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
        <div>
            <h1 class="text-xl font-bold">
                Manzanita <span class="text-blue-400">Store</span>
            </h1>
            <p class="text-xs text-slate-400">Sistema de gestión</p>
        </div>
        <a href="../autenticacion/login.html"
           class="rounded-lg border border-slate-700 px-4 py-2 text-sm hover:bg-slate-800">
            Salir
        </a>
    </div>
</header>

<main class="mx-auto max-w-4xl px-6 py-8">

    <a href="inventario.html"
       class="text-sm font-medium text-blue-600 hover:underline">
        ← Volver al inventario
    </a>

    <div class="mb-7 mt-5">
        <p class="text-sm font-medium text-blue-600">Administración</p>
        <h2 class="text-3xl font-bold">Registrar producto</h2>
        <p class="mt-2 text-sm text-slate-500">
            Agrega productos, accesorios y refacciones al inventario.
        </p>
    </div>

    <form id="formulario"
          class="rounded-xl bg-white p-6 shadow-sm sm:p-8">

        <h3 class="mb-5 border-b pb-3 text-lg font-semibold">
            Información del producto
        </h3>

        <div class="grid gap-5 sm:grid-cols-2">

            <div>
                <label for="codigo" class="mb-2 block text-sm font-medium">
                    Código del producto *
                </label>
                <input id="codigo" name="codigo" type="text"
                       required maxlength="30" pattern="[A-Za-z0-9_-]+"
                       placeholder="Ej. PROD-005"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-blue-500 outline-none">
            </div>

            <div>
                <label for="nombre" class="mb-2 block text-sm font-medium">
                    Nombre del producto *
                </label>
                <input id="nombre" name="nombre" type="text"
                       required maxlength="120"
                       placeholder="Ej. iPhone 15 Pro"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3 focus:border-blue-500 outline-none">
            </div>

            <div>
                <label for="categoria" class="mb-2 block text-sm font-medium">
                    Categoría *
                </label>
                <select id="categoria" name="categoria" required
                        class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3">
                    <option value="">Selecciona una categoría</option>
                    <option value="iPhone">iPhone</option>
                    <option value="Mac">Mac</option>
                    <option value="Accesorios">Accesorios</option>
                    <option value="Refacciones">Refacciones</option>
                </select>
            </div>

            <div>
                <label for="marca" class="mb-2 block text-sm font-medium">
                    Marca *
                </label>
                <input id="marca" name="marca" type="text"
                       required maxlength="80"
                       placeholder="Ej. Apple"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

        </div>

        <h3 class="mb-5 mt-8 border-b pb-3 text-lg font-semibold">
            Precios del producto
        </h3>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="costo" class="mb-2 block text-sm font-medium">
                    Costo de compra (MXN) *
                </label>
                <input id="costo" name="costo" type="number"
                       min="0" max="999999999" step="0.01" required
                       placeholder="0.00"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label for="precio" class="mb-2 block text-sm font-medium">
                    Precio de venta (MXN) *
                </label>
                <input id="precio" name="precio" type="number"
                       min="0" max="999999999" step="0.01" required
                       placeholder="0.00"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>
        </div>

        <h3 class="mb-5 mt-8 border-b pb-3 text-lg font-semibold">
            Control de existencias
        </h3>

        <div class="grid gap-5 sm:grid-cols-2">
            <div>
                <label for="stock" class="mb-2 block text-sm font-medium">
                    Existencias iniciales *
                </label>
                <input id="stock" name="stock" type="number"
                       min="0" max="999999" step="1" required
                       placeholder="Ej. 10"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div>
                <label for="minimo" class="mb-2 block text-sm font-medium">
                    Stock mínimo *
                </label>
                <input id="minimo" name="minimo" type="number"
                       min="0" max="999999" step="1" required
                       placeholder="Ej. 3"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>

            <div class="sm:col-span-2">
                <label for="proveedor" class="mb-2 block text-sm font-medium">
                    Proveedor
                </label>
                <input id="proveedor" name="proveedor" type="text"
                       maxlength="120"
                       placeholder="Nombre del proveedor"
                       class="w-full rounded-lg border border-slate-300 px-4 py-3">
            </div>
        </div>

        <h3 class="mb-5 mt-8 border-b pb-3 text-lg font-semibold">
            Información adicional
        </h3>

        <div>
            <label for="descripcion" class="mb-2 block text-sm font-medium">
                Descripción
            </label>
            <textarea id="descripcion" name="descripcion" rows="4"
                      maxlength="1000"
                      placeholder="Características y detalles del producto..."
                      class="w-full rounded-lg border border-slate-300 px-4 py-3"></textarea>
        </div>

        <div id="mensaje" role="status" aria-live="polite"
             class="mt-6 hidden rounded-lg bg-blue-50 p-4 text-sm text-blue-800">
        </div>

        <div class="mt-8 flex flex-wrap justify-end gap-3 border-t pt-6">
            <a href="inventario.html"
               class="rounded-lg border border-slate-300 px-6 py-3 text-sm font-semibold hover:bg-slate-100">
                Cancelar
            </a>

            <button type="submit"
                    class="rounded-lg bg-blue-600 px-6 py-3 text-sm font-semibold text-white hover:bg-blue-700">
                Guardar producto
            </button>
        </div>
    </form>

</main>

<footer class="py-6 text-center text-xs text-slate-400">
    Manzanita Store · 2026
</footer>

<script>
    const formulario = document.getElementById("formulario");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", function(evento) {
        evento.preventDefault();

        if (!formulario.reportValidity()) return;

        const costo = Number(document.getElementById("costo").value);
        const precio = Number(document.getElementById("precio").value);

        if (precio < costo) {
            mensaje.classList.remove("hidden");
            mensaje.className =
                "mt-6 rounded-lg bg-red-50 p-4 text-sm text-red-700";
            mensaje.textContent =
                "Revisa los precios: el precio de venta es menor al costo.";
            return;
        }

        mensaje.classList.remove("hidden");
        mensaje.className =
            "mt-6 rounded-lg bg-blue-50 p-4 text-sm text-blue-800";

        mensaje.textContent =
            "Formulario validado correctamente. " +
            "El registro definitivo se habilitará al conectar MySQL.";
    });
</script>

</body>
</html>
